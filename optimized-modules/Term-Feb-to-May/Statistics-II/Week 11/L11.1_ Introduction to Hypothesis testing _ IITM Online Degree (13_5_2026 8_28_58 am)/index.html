&nbsp;</span></button><button _ngcontent-ng-c667708395 class="cue ng-star-inserted"><span _ngcontent-ng-c667708395 class=sf-hidden>04:38</span><span _ngcontent-ng-c667708395>What are the possible outcomes that can happen&nbsp;

&nbsp;</span></button><button _ngcontent-ng-c667708395 class="cue ng-star-inserted"><span _ngcontent-ng-c667708395 class=sf-hidden>25:13</span><span _ngcontent-ng-c667708395>Generally you expect the null hypothesis to be&nbsp;
